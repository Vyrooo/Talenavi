
services:
  # Service 1: Laravel Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talenavi_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-fico_store}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-1440}
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - talenavi_network
    depends_on:
      db:
        condition: service_healthy

  # Service 2: Nginx Web Server
  web:
    image: nginx:alpine
    container_name: talenavi_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - talenavi_network
    depends_on:
      - app

  # Service 3: MySQL Database
  db:
    image: mysql:8.0
    container_name: talenavi_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fico_store}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - talenavi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Service 4: phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: talenavi-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - talenavi_network

volumes:
  db_data:
    driver: local

networks:
  talenavi_network:
    driver: bridge
